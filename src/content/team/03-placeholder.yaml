name: "Otto Alfonso Sierra Meléndez"
role: "M.S. Student, Biomedical Engineering"
bio: >-
  Otto Alfonso Sierra Meléndez is a Mechanical Engineer currently pursuing an M.S. in
  Biomedical Engineering. His research interests include robotics, biomechanics,
  control, human–robot interaction, mechanical design, prosthetics, and exoskeletons.


  His current research focuses on the development of a kinematic control algorithm
  for a seven-degree-of-freedom robotic manipulator intended for assistive
  applications. Using Drake and optimization-based inverse kinematics methods, his
  work focuses on incorporating safety constraints while maintaining reliable
  latency for real-time implementation. His work also includes virtual modeling,
  experimental validation, and integration with the physical actuators.


  He is particularly interested in the development of robotic and biomechanical
  systems that combine mechanical design, control, and human-centered applications.
