name: "Numael Segundo Cuello Escamilla"
role: "Adjunct Professor, Mechanical Engineering"
bio: >-
  Numael Segundo Cuello Escamilla is an Adjunct Professor in the Mechanical
  Engineering Program at Universidad del Norte, with more than 10 years of teaching
  experience in Materials Science and Manufacturing Processes. He holds a degree in
  Mechanical Engineering and a Master of Business Administration (MBA), both from
  Universidad del Norte.


  He has more than 20 years of industrial experience at Smurfit Westrock, a leading
  multinational company in the global paper and packaging industry. Throughout his
  professional career, he has worked in the areas of production, occupational
  health and safety, and continuous improvement, developing extensive experience in
  industrial operations, process optimization, and performance improvement.


  He is currently conducting research focused on the validation and optimization of
  process parameters for 3D-printed carbon-fiber-reinforced components, with
  particular emphasis on improving their mechanical performance and fatigue
  resistance.
