role: "Electronic Engineer & Biomedical Engineering Specialist"
bio: >-
  Enso Jovanis Jiménez Turizo is an Electronic Engineer and Biomedical Engineering
  Specialist. He is currently pursuing a Master's degree in Biomedical Engineering at
  Universidad del Norte, Colombia, and serves as Laboratory Coordinator at Universidad
  Simón Bolívar. He is a member of IEEE, and his academic distinctions from
  Universidad del Norte include the Honor Roll and the Distinguished Student Award.
