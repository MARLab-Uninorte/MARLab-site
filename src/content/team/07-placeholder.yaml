name: "Isamar Paola Sampayo Gómez"
role: "Research Engineer, Mechanical Engineering"
bio: >-
  Isamar Paola Sampayo Gómez is a Mechanical Engineer and holds a Master's degree in
  Mechanical Engineering, with experience in mechanical design, robotics, optimization,
  and engineering education.


  Her research focuses on robotics applied to agriculture, particularly the design and
  optimization of a Delta parallel robot for weed control in rice crops. Through this
  work, she has explored how mechanical design, optimization, and automation can be
  integrated to develop more efficient and sustainable agricultural technologies.


  She is currently working on AIRA, an assistive robot, where she is responsible for
  finite element analysis (FEA) and dynamic calculations, including acceleration and
  torque analysis. She is also looking forward to participating in the robot's
  construction and assembly phase.


  She also works as an engineering professor, combining her academic and professional
  experience.
