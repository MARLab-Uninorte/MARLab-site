title: "Delta Robot for Selective Weed Control in Rice Crops"
line: "agriculture"
status: "Ongoing"
summary: "Design and optimization of a Delta parallel robot for selective weed control in rice crops."
description: >-
  This project designs and optimizes a Delta parallel robot for selective weed
  control in rice crops, adapted to the agro-industrial conditions of Colombia's
  Caribbean region. The work combines mechanical design and optimization to develop
  a platform capable of targeting weeds with the precision needed to reduce
  herbicide use in the field.


  The project explores how mechanical design, optimization, and automation can be
  integrated to produce more efficient and sustainable agricultural technologies,
  building toward autonomous platforms for crop monitoring and field data
  collection.
contributors:
  - "Isamar Paola Sampayo Gómez"
order: 1
